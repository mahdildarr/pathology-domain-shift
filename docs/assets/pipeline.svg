<svg xmlns="http://www.w3.org/2000/svg" width="960" height="353" viewBox="0 0 960 353" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8962e"/></marker></defs>
<rect width="960" height="353" rx="14" fill="#ffffff"/>
<text x="32" y="38" font-size="18" font-weight="700" fill="#1d2733">Metastasis detection on hospitals the model has never seen</text>
<text x="32" y="60" font-size="12.5" fill="#5b6775">Camelyon17-WILDS: train in some hospitals, test in another, and check whether the model knows when it is unsure</text>
<g transform="translate(32.0,86)">
<rect width="198.5" height="243" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">1 · DATA</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Camelyon17-WILDS</text>
<text x="14" y="70" font-size="11" fill="#5b6775">lymph-node histopathology</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">5 hospitals, 50 slides</text>
<text x="14" y="112" font-size="11" fill="#5b6775">96×96 px patches</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#1d2733">Label</text>
<text x="14" y="154" font-size="11" fill="#5b6775">tumour in the central region</text>
</g>
<line x1="234.5" y1="208" x2="260.5" y2="208" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(264.5,86)">
<rect width="198.5" height="243" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">2 · STAIN HANDLING</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Macenko normalisation</text>
<text x="14" y="70" font-size="11" fill="#5b6775">train and test</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">HED augmentation</text>
<text x="14" y="112" font-size="11" fill="#5b6775">training only</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#1d2733">Colour jitter, greyscale</text>
<text x="14" y="154" font-size="11" fill="#5b6775">baselines</text>
</g>
<line x1="467.0" y1="208" x2="493.0" y2="208" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(497.0,86)">
<rect width="198.5" height="243" rx="10" fill="#2c5578"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#f0d79e" letter-spacing=".6">3 · MODELS</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#ffffff">DenseNet-121, ResNet-50</text>
<text x="14" y="70" font-size="11" fill="#d7e3ee">EfficientNet-B0 (ImageNet)</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#ffffff">Slide-held-out validation</text>
<text x="14" y="112" font-size="11" fill="#d7e3ee">no leakage</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#ffffff">AdaBN at test time</text>
<text x="14" y="154" font-size="11" fill="#d7e3ee">unlabelled target hospital</text>
</g>
<line x1="699.5" y1="208" x2="725.5" y2="208" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(729.5,86)">
<rect width="198.5" height="243" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">4 · EVALUATION</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Unseen hospital</text>
<text x="14" y="70" font-size="11" fill="#5b6775">accuracy, AUROC, per slide</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Calibration</text>
<text x="14" y="112" font-size="11" fill="#5b6775">ECE, reliability diagram,</text>
<text x="14" y="127" font-size="11" fill="#5b6775">temperature scaling</text>
<text x="14" y="153" font-size="12.5" font-weight="700" fill="#1d2733">Selective prediction</text>
<text x="14" y="169" font-size="11" fill="#5b6775">accuracy at 80% coverage</text>
<text x="14" y="195" font-size="12.5" font-weight="700" fill="#1d2733">Protocols</text>
<text x="14" y="211" font-size="11" fill="#5b6775">official + leave-one-out</text>
</g>
</svg>
